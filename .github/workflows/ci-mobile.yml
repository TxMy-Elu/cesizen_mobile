name: CI — cesizen_mobile

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev

jobs:

  # ── Analyse statique + tests + build ────────────────────────────────────────
  build:
    name: Analyze & Test (Flutter 3.41)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Build APK release : valide que l'app compile pour Android.
      - name: Build APK (release)
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
