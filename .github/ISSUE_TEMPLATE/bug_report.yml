name: 🐛 Bug
description: Signaler un dysfonctionnement de l'app mobile CESIZen
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Ouvrir l'écran ...
        2. Toucher ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Message d'erreur, capture, log `flutter run`.
      render: text
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options:
        - Android (émulateur)
        - Android (appareil réel)
        - iOS (simulateur)
        - iOS (appareil réel)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de l'app / OS
      placeholder: "app 1.0.0 · Android 14"
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Criticité
      options:
        - Bloquant (crash / app inutilisable)
        - Majeur (fonctionnalité cassée)
        - Mineur (contournement possible)
        - Cosmétique
    validations:
      required: true
